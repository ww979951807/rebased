name: IDE Build and Upload

on:
  workflow_call:
    inputs:
      product:
        description: 'a product, available options: intellij_idea, pycharm'
        type: string
        required: true
      artifacts_dir:
        description: 'artifacts directory'
        type: string
        required: true
      version:
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  distributions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: resolve version
        id: resolve-version
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="$(cat build.txt)"; fi
          echo "version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build_ide
        with:
          product: ${{inputs.product}}
          version: ${{inputs.version}}
      - name: upload-windows-zip-x64
        uses: ./.github/actions/upload_ide
        with:
          os: windows
          suffix: .win.zip
          artifacts_dir: ${{inputs.artifacts_dir}}
